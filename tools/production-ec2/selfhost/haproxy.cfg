global
  daemon
  maxconn 2048
  user haproxy
  group haproxy
defaults
  mode tcp
  timeout connect 5s
  timeout client 30m
  timeout server 30m
frontend jupiter_tls
  bind 172.31.27.165:443
  bind 127.0.0.1:443
  tcp-request inspect-delay 5s
  tcp-request content accept if { req.ssl_hello_type 1 }
  use_backend jupiter_turn if { req.ssl_sni -i producer-turn.jupiter.events }
  default_backend jupiter_https
backend jupiter_turn
  server relay 127.0.0.2:443 send-proxy-v2
backend jupiter_https
  server caddy 127.0.0.1:8443
